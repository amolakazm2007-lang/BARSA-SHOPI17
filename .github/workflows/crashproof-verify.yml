name: Crash-Proof Verification

on:
  workflow_dispatch:
  push:
    branches: [ crashproof-final ]

concurrency:
  group: crashproof-final
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crashproof-final
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply deterministic crash-proof integration
        run: |
          node scripts/apply-crashproof-video-pipeline.mjs
          node scripts/apply-crashproof-storage-integrity.mjs
          node scripts/apply-crashproof-rife.mjs
          node scripts/apply-crashproof-upscale.mjs
          node scripts/apply-crashproof-face.mjs
          node scripts/apply-p0-e2e-runtime-fixes.mjs
          node scripts/apply-p0-output-lease-fixes.mjs
          node scripts/apply-doctor-control-plane.mjs
          node scripts/apply-webcodecs-queue-watchdog.mjs
      - name: Update vulnerable build and browser dependencies safely
        run: npm install --save-dev --save-exact vite@6.4.3 playwright@1.63.0 --package-lock-only
      - name: Persist deterministic integration updates safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Persistence attempt ${attempt}/3"
            git fetch origin crashproof-final
            git reset --hard origin/crashproof-final

            node scripts/apply-crashproof-video-pipeline.mjs
            node scripts/apply-crashproof-storage-integrity.mjs
            node scripts/apply-crashproof-rife.mjs
            node scripts/apply-crashproof-upscale.mjs
            node scripts/apply-crashproof-face.mjs
            node scripts/apply-p0-e2e-runtime-fixes.mjs
            node scripts/apply-p0-output-lease-fixes.mjs
            node scripts/apply-doctor-control-plane.mjs
            node scripts/apply-webcodecs-queue-watchdog.mjs
            npm install --save-dev --save-exact vite@6.4.3 playwright@1.63.0 --package-lock-only

            if git diff --quiet; then
              echo "Generated sources already synchronized with latest crashproof-final."
              exit 0
            fi

            git add src/main.js src/engine/EngineManager.js src/engine/VideoPipeline.js src/engine/WebGL2Engine.js src/engine/WebCodecsEngine.js src/engine/StorageManager.js src/engine/ApplyStackEngine.js src/engine/RIFEEngine.js src/engine/UpscaleEngine.js src/engine/FaceRestorationEngine.js package.json package-lock.json
            git commit -m "Apply crash-proof pipeline integration and security updates"
            if git push origin HEAD:crashproof-final; then
              echo "Generated integration persisted by fast-forward push."
              exit 0
            fi

            echo "Branch advanced during persistence; retrying from latest remote head."
          done

          echo "Unable to persist generated integration after three fast-forward attempts." >&2
          exit 1
      - name: Normalize final version metadata
        run: node scripts/normalize-version-lock.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:release-invariants
      - run: npm audit --audit-level=high
      - name: Install real Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Real browser catastrophic fault injection
        run: node tests/crashproof-browser-faults.mjs
      - name: Full real browser render upload-to-result
        run: npm run test:browser
      - name: Upload browser crash-proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crashproof-browser-evidence
          path: |
            tests/e2e-v4.png
            tests/e2e-v4-mobile.png
          if-no-files-found: ignore

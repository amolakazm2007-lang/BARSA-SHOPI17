name: Crash-Proof Verification

on:
  workflow_dispatch:
  push:
    branches: [ crashproof-final ]

concurrency:
  group: crashproof-final
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crashproof-final
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply deterministic crash-proof integration
        run: |
          node scripts/apply-crashproof-video-pipeline.mjs
          node scripts/apply-crashproof-storage-integrity.mjs
          node scripts/apply-crashproof-rife.mjs
          node scripts/apply-crashproof-upscale.mjs
          node scripts/apply-crashproof-face.mjs
          node scripts/apply-p0-e2e-runtime-fixes.mjs
      - name: Update vulnerable build and browser dependencies safely
        run: npm install --save-dev --save-exact vite@6.4.3 playwright@1.63.0 --package-lock-only
      - name: Persist deterministic integration updates
        run: |
          if git diff --quiet; then
            echo "No generated source or dependency changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/engine/VideoPipeline.js src/engine/WebGL2Engine.js src/engine/StorageManager.js src/engine/RIFEEngine.js src/engine/UpscaleEngine.js src/engine/FaceRestorationEngine.js package.json package-lock.json
            git commit -m "Apply crash-proof pipeline integration and security updates"
            git push origin HEAD:crashproof-final
          fi
      - name: Normalize final version metadata
        run: node scripts/normalize-version-lock.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:release-invariants
      - run: npm audit --audit-level=high
      - name: Install real Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Real browser catastrophic fault injection
        run: node tests/crashproof-browser-faults.mjs
      - name: Full real browser render upload-to-result
        run: npm run test:browser
      - name: Upload browser crash-proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crashproof-browser-evidence
          path: |
            tests/e2e-v4.png
            tests/e2e-v4-mobile.png
          if-no-files-found: ignore

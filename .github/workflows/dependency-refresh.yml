name: One-shot dependency refresh

on:
  push:
    branches: [ crashproof-final ]
    paths:
      - '.github/workflows/dependency-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crashproof-final
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh only audited dev dependencies
        run: npm install --save-dev --save-exact vite@6.4.3 playwright@1.63.0
      - name: Verify dependency tree
        run: npm audit --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Harden audited build dependencies"
          git push origin HEAD:crashproof-final

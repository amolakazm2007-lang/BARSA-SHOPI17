name: BARSA SHOPI APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: barsa-shopi-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare BARSA runtime
        run: npm run prepare:runtime

      - name: Quality and security gates
        shell: bash
        run: |
          mkdir -p reports
          npm run check
          npm run verify:runtime
          npm run final:audit
          npm run check:packaging
          npm audit --omit=dev --audit-level=critical --json > reports/npm-audit.json

      - name: Build web app
        run: npm run build

      - name: Sync Android
        run: npm run android:sync

      - name: Verify Android project
        shell: bash
        run: |
          gradle -p android :app:lintDebug \
            --stacktrace \
            --no-daemon

      - name: Build Android APK
        shell: bash
        run: |
          gradle -p android :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            find android -type f | tail -n 100
            exit 1
          fi

          cp "$APK" release/BARSA-SHOPI-v10-RC15.1-debug.apk
          sha256sum release/BARSA-SHOPI-v10-RC15.1-debug.apk \
            > release/BARSA-SHOPI-v10-RC15.1-debug.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            release/BARSA-SHOPI-v10-RC15.1-debug.apk \
            > release/BARSA-SHOPI-v10-RC15.1-debug.apksigner.txt

          cp android/app/build/reports/lint-results-debug.html reports/ 2>/dev/null || true
          cp android/app/build/reports/lint-results-debug.xml reports/ 2>/dev/null || true
          ls -lh release/ reports/

      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: BARSA-SHOPI-v10-RC15.1-APK
          path: |
            release/BARSA-SHOPI-v10-RC15.1-debug.apk
            release/BARSA-SHOPI-v10-RC15.1-debug.sha256
            release/BARSA-SHOPI-v10-RC15.1-debug.apksigner.txt
            reports/**
          if-no-files-found: error
          retention-days: 30

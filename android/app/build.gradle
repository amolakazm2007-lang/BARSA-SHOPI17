plugins { id 'com.android.application' }

android {
    namespace 'com.barsa.shopi'
    compileSdk 36

    defaultConfig {
        applicationId 'com.barsa.shopi'
        minSdk 29
        targetSdk 36
        versionCode 1001501
        versionName '10.0.0-rc15.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
        // Intentional: BARSA SHOPI is a local WebView application whose JavaScript
        // bridge is restricted to the app's loopback origin and uses a per-session token.
        disable 'SetJavaScriptEnabled'
        // Intentional compatibility guards are kept around newer platform APIs even
        // though the current minSdk is 29, so future minSdk changes remain low-risk.
        disable 'ObsoleteSdkInt'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}

plugins { id 'com.android.application' }

android {
    namespace 'com.barsa.shopi'
    compileSdk 36

    defaultConfig {
        applicationId 'com.barsa.shopi'
        minSdk 29
        targetSdk 36
        versionCode 1002000
        versionName '10.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
        disable 'SetJavaScriptEnabled'
        disable 'ObsoleteSdkInt'
        // Deliberately pinned: androidx.core 1.19.0 requires API 37 / AGP 9.1,
        // while this Android 16 build targets API 36 with AGP 8.9.1.
        disable 'GradleDependency'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
}
